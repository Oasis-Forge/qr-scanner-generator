# Lints for QR Scanner + Generator: flutter_lints plus the strict set from docs/STACK_NOTES.md.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  errors:
    unawaited_futures: warning
    # We keep readable public parameter names (`now:`, `personalizedAllowed:`) in
    # front of private fields; this rule would have us rename them to `_now:`.
    prefer_initializing_formals: ignore

linter:
  rules:
    - unawaited_futures
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - always_declare_return_types
