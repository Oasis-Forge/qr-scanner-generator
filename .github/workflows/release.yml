name: Release

# Every merge to main builds the APK and AAB and checks the release manifest's
# permissions (RUN-2).
#
# It leaves nothing behind (decided 2026-09-21): no GitHub Release, no artifact,
# no Play upload, and no tag. The build here is a check that the release build
# compiles on a clean machine, not a deliverable. What reaches Play is built
# locally, signed from android/key.properties and uploaded by hand
# (docs/RELEASING.md). With no tags, the version gate compares a PR against
# main's own version (scripts/version.sh check).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'
  PACKAGE_NAME: 'com.oasisforge.qrscanner'

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.read.outputs.name }}
      release: ${{ steps.read.outputs.release }}
    steps:
      # Two commits: on main the gate compares this merge against the one
      # before it (scripts/version.sh check).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Read the pubspec.yaml version
        id: read
        run: |
          name=$(bash scripts/version.sh name)
          release=false
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Not on main: building $name as a check only." >> "$GITHUB_STEP_SUMMARY"
          else
            # Most merges are not releases (decided 2026-09-21): the version
            # stands still until the user decides to cut one. When it does
            # move, the gate runs again here against the commit before this
            # merge, because CI compared the branch against main and two
            # branches opened together can both pass with the same version —
            # the first merge moves main, and the second would otherwise land
            # as part of no release, leaving its code out of every changelog.
            bash scripts/version.sh check
            release=$(bash scripts/version.sh changed)
            if [ "$release" != true ]; then
              echo "No release in this merge: main stays on $name." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          { echo "name=$name"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build and check
    needs: version
    # Every merge builds, release or not: this job is the proof that the
    # release build still compiles on a clean machine and that RUN-2's
    # permission list still holds. Only the summary changes when the version
    # stood still.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.version.outputs.name }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set: this build is debug-signed. That is expected — CI publishes nothing, and the bundle that goes to Play is signed and built locally (docs/RELEASING.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build app bundle and APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      # RUN-2: the store listing's data-safety answers depend on the permissions.
      # List the ones the app may declare; any other fails the release.
      - name: Check the APK's permissions
        env:
          # CAMERA: the scanner (RUN-1). INTERNET, ACCESS_NETWORK_STATE: Google's
          # data transport, which ML Kit uses for its usage statistics (privacy
          # policy → Code reading); ads and billing will add their own.
          ALLOWED: >-
            android.permission.CAMERA
            android.permission.INTERNET
            android.permission.ACCESS_NETWORK_STATE
            com.android.vending.BILLING
            com.google.android.gms.permission.AD_ID
            android.permission.ACCESS_ADSERVICES_AD_ID
            android.permission.ACCESS_ADSERVICES_ATTRIBUTION
            android.permission.ACCESS_ADSERVICES_TOPICS
            android.permission.WAKE_LOCK
            android.permission.FOREGROUND_SERVICE
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          unexpected=$(sed -nE "s/^uses-permission(-sdk-23)?: name='([^']+)'.*/\2/p" permissions.txt \
            | grep -v "^${PACKAGE_NAME}\." | grep -vxF -f <(printf '%s\n' $ALLOWED) || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The release APK declares permissions outside the allowed list (RUN-2): $unexpected"
            exit 1
          fi

      # This workflow leaves nothing behind (decided 2026-09-21): no GitHub
      # Release, no artifact, no Play upload, and no tag. It exists to prove the
      # release build compiles on a clean machine and to hold the RUN-2
      # permission gate above. The bundle that reaches Play is built locally
      # with `flutter build appbundle --release`, signed from
      # `android/key.properties`, and uploaded by hand (`docs/RELEASING.md`).
      #
      # Without tags, the version gate compares a PR against main's own version
      # instead (`scripts/version.sh check`).
      - name: Say where the uploadable bundle comes from
        if: env.RELEASE == 'true'
        run: |
          {
            echo "### $NAME builds"
            echo
            echo "Nothing is published from CI, and no tag is pushed. Build the bundle locally and upload it by hand:"
            echo
            echo '```powershell'
            echo '$env:GRADLE_OPTS = "-Dorg.gradle.project.kotlin.incremental=false"'
            echo 'flutter build appbundle --release'
            echo '```'
            echo
            echo "See docs/RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"
